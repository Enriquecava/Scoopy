server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Write access and error logs to stdout/stderr so they are collected by Docker
    # and can be forwarded to Grafana/Loki or other logging systems
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # React Router: serve index.html for any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Only Vite's hashed build output is safe to cache immutably; unhashed
    # files under /public (e.g. /logo.png) must stay revalidatable.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
